<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORRIS</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href=""><img src="../images/common/logo.png" alt="" /></a>
      </h1>
      <nav class="gnb">
        <ul class="list">
          <li><a href="">상품소개</a></li>
          <li><a href="">회사소개</a></li>
          <li><a href="">연구개발</a></li>

        </ul>
      </nav>

    <!-- header end -->
    <div class="main-visual">
      <ul class="swiper-wrapper visual-list">

        <li class="swiper-slide visual02"><img src="../images/main/visual02.jpg" alt="" /></li>
        <li class="swiper-slide visual03"><img src="../images/main/visual03.jpg" alt="" /></li>
        <li class="swiper-slide visual04"><img src="../images/main/visual04.jpg" alt="" /></li>
      </ul>
      <!-- <div class="swiper-pagination"></div> -->
    </div>
    <script>
      mainSlider = new Swiper(".main-visual", {
        loop: true,
        speed: 1,
        effect: "fade",
      });
    </script>
    <!-- main visual end -->
  </body>
